<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
  data-namespace-typo3-fluid="true"
>
  <f:debug>{_all}</f:debug>

  <table>
    <thead>
      <tr>
        <th>Titel</th>
        <th>Autor</th>
        <th>Bewertung</th>
        <th>Fertig?</th>
      </tr>
    </thead>
    <tbody>
      <f:for each="{books}" as="book">
        <tr>
          <td>{book.title}</td>
          <td>{book.author}</td>
          <td>{book.rating}</td>
          <td>
            <f:if condition="{book.readingDone}">
              <f:then>Ja</f:then>
              <f:else>Nein</f:else>
            </f:if>
          </td>
        </tr>
      </f:for>
    </tbody>
  </table>
</html>
